<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#030508"/>

  <!-- Connecting lines — dashed phosphor -->
  <line x1="16" y1="5"  x2="5"  y2="24" stroke="#9DFFB0" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.55"/>
  <line x1="16" y1="5"  x2="27" y2="24" stroke="#9DFFB0" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.55"/>
  <line x1="5"  y1="24" x2="27" y2="24" stroke="#9DFFB0" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.55"/>
  <line x1="16" y1="5"  x2="16" y2="19" stroke="#9DFFB0" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.35"/>

  <!-- Outer nodes -->
  <circle cx="5"  cy="24" r="1.5" fill="#9DFFB0" opacity="0.7"/>
  <circle cx="27" cy="24" r="1.5" fill="#9DFFB0" opacity="0.7"/>

  <!-- Top node — glowing -->
  <circle cx="16" cy="5" r="2.5" fill="#9DFFB0" filter="url(#glow)" opacity="0.9"/>

  <!-- Center hub — brightest, most prominent -->
  <circle cx="16" cy="19" r="3.5" fill="#9DFFB0" filter="url(#glow-soft)"/>
</svg>
